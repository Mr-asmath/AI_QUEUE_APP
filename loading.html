<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Queue Loading</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100%;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:transparent;
      overflow:hidden;
      font-family:Arial, sans-serif;
    }

    .loader-wrapper{
      display:flex;
      flex-direction:column;
      align-items:center;
      background:transparent;
    }

    .loading-frame{
      width:320px;
      height:260px;
      border-radius:30px;
      position:relative;
      background:#fff;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .loading-frame::before{
      content:"";
      position:absolute;
      width:150%;
      height:150%;
      background:conic-gradient(transparent, transparent, transparent, #4fc3ff);
      animation:borderRotate 1.6s linear infinite;
    }

    .loading-frame::after{
      content:"";
      position:absolute;
      inset:5px;
      background:#fff;
      border-radius:26px;
    }

    .queue-area{
      position:relative;
      z-index:2;
      width:240px;
      height:150px;
      overflow:hidden;
      border-radius:20px;
    }

    .person{
      position:absolute;
      bottom:15px;
      width:42px;
      display:flex;
      flex-direction:column;
      align-items:center;
      animation:moveQueue 3s linear infinite;
      opacity:0;
    }

    .person:nth-child(1){
      animation-delay:0s;
    }

    .person:nth-child(2){
      animation-delay:0.6s;
    }

    .person:nth-child(3){
      animation-delay:1.2s;
    }

    .person:nth-child(4){
      animation-delay:1.8s;
    }

    .person:nth-child(5){
      animation-delay:2.4s;
    }

    .head{
      width:34px;
      height:34px;
      border-radius:50%;
      background:#4fc3ff;
      box-shadow:0 0 15px rgba(79,195,255,0.8);
    }

    .body{
      width:38px;
      height:52px;
      margin-top:6px;
      border-radius:18px 18px 12px 12px;
      background:#4fc3ff;
      box-shadow:0 0 15px rgba(79,195,255,0.5);
    }

    .loading-text{
      margin-top:14px;
      color:#4fc3ff;
      font-size:14px;
      font-weight:bold;
      letter-spacing:2px;
      text-align:center;
    }

    @keyframes borderRotate{
      from{
        transform:rotate(0deg);
      }
      to{
        transform:rotate(360deg);
      }
    }

    @keyframes moveQueue{
      0%{
        transform:translateX(240px) scale(0.8);
        opacity:0;
      }

      15%{
        opacity:1;
      }

      75%{
        opacity:1;
      }

      100%{
        transform:translateX(-70px) scale(1);
        opacity:0;
      }
    }
  </style>
</head>

<body>

  <div class="loader-wrapper">

    <div class="loading-frame">

      <div class="queue-area">

        <div class="person">
          <div class="head"></div>
          <div class="body"></div>
        </div>

        <div class="person">
          <div class="head"></div>
          <div class="body"></div>
        </div>

        <div class="person">
          <div class="head"></div>
          <div class="body"></div>
        </div>

        <div class="person">
          <div class="head"></div>
          <div class="body"></div>
        </div>

        <div class="person">
          <div class="head"></div>
          <div class="body"></div>
        </div>

      </div>

    </div>

    <div class="loading-text">QUEUE LOADING</div>

  </div>

  <script>
    const loadingText = document.querySelector(".loading-text");
    let dotCount = 0;

    setInterval(() => {
      dotCount++;

      if(dotCount > 3){
        dotCount = 0;
      }

      loadingText.textContent = "QUEUE LOADING" + ".".repeat(dotCount);
    }, 500);
  </script>

</body>
</html>
