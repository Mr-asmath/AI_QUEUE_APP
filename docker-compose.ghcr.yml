services:
  backend:
    image: ghcr.io/mr-asmath/ai-queue-app-backend:latest
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/multi_industry_queue.db}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/ai_queue_app}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-ai_queue_app}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-60}
      REMINDER_WINDOW_MINUTES: ${REMINDER_WINDOW_MINUTES:-10}
      AUTOMATION_API_KEY: ${AUTOMATION_API_KEY:-local-automation-key}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      WEB_THREADS: ${WEB_THREADS:-4}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - queue-data:/data
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    image: ghcr.io/mr-asmath/ai-queue-app-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  queue-data:
  mongo-data:
  mongo-config:
  redis-data:
