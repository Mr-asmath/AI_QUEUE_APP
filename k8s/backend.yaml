apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-queue-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-queue-backend
  template:
    metadata:
      labels:
        app: ai-queue-backend
    spec:
      containers:
        - name: backend
          image: ai-queue-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-queue-secrets
                  key: secret-key
            - name: DATABASE_URL
              value: sqlite:////data/multi_industry_queue.db
            - name: MONGODB_URI
              value: mongodb://mongodb:27017/ai_queue_app
            - name: MONGODB_DATABASE
              value: ai_queue_app
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: SESSION_TTL_DAYS
              value: "30"
            - name: TOKEN_TTL_MINUTES
              value: "60"
            - name: REMINDER_WINDOW_MINUTES
              value: "10"
            - name: AUTOMATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-queue-secrets
                  key: automation-api-key
            - name: WEB_CONCURRENCY
              value: "2"
            - name: WEB_THREADS
              value: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: queue-data
              mountPath: /data
      volumes:
        - name: queue-data
          persistentVolumeClaim:
            claimName: ai-queue-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-queue-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-queue-backend
spec:
  selector:
    app: ai-queue-backend
  ports:
    - port: 5000
      targetPort: 5000
