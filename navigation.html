<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Queue Navigation Dock</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      width:100%;
      height:100vh;
      background:#eefaff;
      overflow-x:hidden;
      overflow-y:auto;
    }

    .page-title{
      position:absolute;
      top:40px;
      width:100%;
      text-align:center;
      color:#28b8ff;
      font-size:30px;
      font-weight:bold;
      letter-spacing:1px;
    }

    .bottom-nav{
      position:fixed;
      bottom:22px;
      left:50%;
      transform:translateX(-50%);
      width:94%;
      max-width:980px;
      height:90px;
      background:#ffffff;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:visible;
      box-shadow:0 10px 30px rgba(79,195,255,0.20);
    }

    .nav-item{
      flex:1;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      cursor:pointer;
      color:#55c9ff;
      transition:0.25s ease;
      border-right:1px solid rgba(79,195,255,0.25);
      background:transparent;
    }

    .nav-item:last-child{
      border-right:none;
    }

    .nav-item .material-icons{
      font-size:34px;
      transition:0.25s ease;
      transform-origin:bottom center;
    }

    .nav-item:hover .material-icons{
      transform:scale(1.7) translateY(-14px);
      color:#4fc3ff;
    }

    .nav-item.active{
      color:#0aa9f2;
      background:transparent;
    }

    .nav-item.active .material-icons{
      transform:scale(1.4);
    }

    .nav-item.active::before{
      content:"";
      position:absolute;
      bottom:-6px;
      left:50%;
      transform:translateX(-50%);
      width:55%;
      height:4px;
      border-radius:20px;
      background:#1eaaf1;
      box-shadow:0 0 10px rgba(30,170,241,0.7);
    }

    @media(max-width:760px){
      .bottom-nav{
        justify-content:flex-start;
        overflow:visible;
      }

      .bottom-nav::-webkit-scrollbar{
        display:none;
      }

      .nav-item{
        min-width:105px;
      }
    }
  </style>
</head>

<body>

  <div class="page-title" id="pageTitle">USER MANAGEMENT</div>

  <nav class="bottom-nav">

    <div class="nav-item" data-title="ACCESS REQUEST">
      <span class="material-icons">vpn_key</span>
    </div>

    <div class="nav-item" data-title="EVENT LOG">
      <span class="material-icons">event_note</span>
    </div>

    <div class="nav-item active" data-title="USER MANAGEMENT">
      <span class="material-icons">groups</span>
    </div>

    <div class="nav-item" data-title="RESET REQUESTS">
      <span class="material-icons">restart_alt</span>
    </div>

    <div class="nav-item" data-title="CURRENT QUEUE">
      <span class="material-icons">pending_actions</span>
    </div>

    <div class="nav-item" data-title="QUEUE HISTORY">
      <span class="material-icons">history</span>
    </div>

    <div class="nav-item" data-title="SECRET">
      <span class="material-icons">shield</span>
    </div>

  </nav>

  <script>
    const navItems = document.querySelectorAll(".nav-item");
    const pageTitle = document.getElementById("pageTitle");

    navItems.forEach(item => {
      item.addEventListener("click", () => {
        navItems.forEach(nav => nav.classList.remove("active"));
        item.classList.add("active");
        pageTitle.textContent = item.dataset.title;
      });
    });
  </script>

</body>
</html>
