name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  REACT_APP_API_ORIGIN: ${{ vars.REACT_APP_API_ORIGIN || 'https://ai-queue-app-backend.onrender.com' }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel secrets
        shell: bash
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is not configured. Add it in GitHub repository Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build frontend for Vercel
        run: vercel build --prod --token "$VERCEL_TOKEN"
        env:
          REACT_APP_API_ORIGIN: ${{ env.REACT_APP_API_ORIGIN }}

      - name: Deploy prebuilt frontend to Vercel
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
