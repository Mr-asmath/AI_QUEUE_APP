name: CI and Docker Publish

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/mr-asmath/ai-queue-app-backend
  FRONTEND_IMAGE: ghcr.io/mr-asmath/ai-queue-app-frontend
  FRONTEND_API_ORIGIN: ${{ vars.REACT_APP_API_ORIGIN || 'http://localhost:5000' }}

jobs:
  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m py_compile backend/app.py

      - name: Import Flask app
        env:
          SECRET_KEY: github-actions
          DATABASE_URL: sqlite:///github_actions.db
          TOKEN_TTL_MINUTES: 60
          REMINDER_WINDOW_MINUTES: 10
          AUTOMATION_API_KEY: github-actions
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); import app; print('backend import ok')"

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: false
          REACT_APP_API_ORIGIN: ${{ env.FRONTEND_API_ORIGIN }}
        run: npm run build

  docker:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            REACT_APP_API_ORIGIN=${{ env.FRONTEND_API_ORIGIN }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
